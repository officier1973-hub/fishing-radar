name: Build Android APK

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Recreate clean Android project and permissions
        shell: bash
        run: |
          rm -rf android /tmp/scaffold
          flutter create --platforms=android --org ru.fishingradar --project-name fishing_radar /tmp/scaffold
          cp -r /tmp/scaffold/android ./android
          python3 - <<'EOF'
          from pathlib import Path
          p = Path("android/app/src/main/AndroidManifest.xml")
          text = p.read_text(encoding="utf-8")
          perms = [
              '<uses-permission android:name="android.permission.INTERNET" />',
              '<uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />',
              '<uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />',
          ]
          missing = [perm for perm in perms if perm.split('"')[1] not in text]
          if missing:
              text = text.replace("<application", "\n    ".join(missing) + "\n    <application", 1)
              p.write_text(text, encoding="utf-8")
          EOF

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze code
        run: flutter analyze --no-fatal-infos

      - name: Build Debug APK
        run: >
          flutter build apk --debug
          --dart-define=SUPABASE_URL=${{ secrets.SUPABASE_URL }}
          --dart-define=SUPABASE_KEY=${{ secrets.SUPABASE_KEY }}

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: fishing-radar-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
