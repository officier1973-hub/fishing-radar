name: Build FishRadar Release APK

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    name: Build FishRadar Release APK
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Recreate clean Android project and permissions
        shell: bash
        run: |
          rm -rf android /tmp/scaffold
          flutter create --platforms=android --org ru.fishingradar --project-name fishing_radar /tmp/scaffold
          cp -r /tmp/scaffold/android ./android
          python3 - <<'EOF'
          import re
          from pathlib import Path

          p = Path("android/app/src/main/AndroidManifest.xml")
          text = p.read_text(encoding="utf-8")
          text = re.sub(r'android:label="[^"]*"', 'android:label="FishRadar"', text, count=1)
          perms = [
              '<uses-permission android:name="android.permission.INTERNET" />',
              '<uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />',
              '<uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />',
          ]
          missing = [perm for perm in perms if perm.split('"')[1] not in text]
          if missing:
              text = text.replace("<application", "\n    ".join(missing) + "\n    <application", 1)
          p.write_text(text, encoding="utf-8")
          EOF

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze code
        run: flutter analyze --no-fatal-infos

      - name: Build Release APK
        run: |
          flutter build apk --release --dart-define=SUPABASE_URL=${{ secrets.SUPABASE_URL }} --dart-define=SUPABASE_KEY=${{ secrets.SUPABASE_KEY }}
          cp build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/FishRadar.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: FishRadar
          path: build/app/outputs/flutter-apk/FishRadar.apk
          if-no-files-found: error
