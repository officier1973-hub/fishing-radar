name: Supabase Keep-Alive

on:
  schedule:
    # Каждые 3 дня в 09:17 UTC
    - cron: '17 9 */3 * *'
  workflow_dispatch:

jobs:
  keep-alive:
    name: Ping Supabase Postgres
    runs-on: ubuntu-latest

    steps:
      - name: Query fishing_spots via PostgREST
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_KEY" ]; then
            echo "ERROR: SUPABASE_URL or SUPABASE_KEY secret is empty."
            exit 1
          fi

          read -r BASE_URL CLEAN_KEY ORIG_PATH < <(python3 - <<'PY'
          import os
          from urllib.parse import urlparse

          raw_url = os.environ["SUPABASE_URL"].strip().strip('"').strip("'")
          raw_key = os.environ["SUPABASE_KEY"].strip().strip('"').strip("'")
          if "://" not in raw_url:
              raw_url = "https://" + raw_url
          parsed = urlparse(raw_url)
          origin = f"{parsed.scheme}://{parsed.netloc}"
          orig_path = parsed.path if parsed.path else "/"
          print(origin, raw_key, orig_path)
          PY
          )

          echo "Secret SUPABASE_URL path: $ORIG_PATH"
          ENDPOINT="${BASE_URL}/rest/v1/fishing_spots?select=id&limit=1"

          if [[ "$CLEAN_KEY" == eyJ* ]]; then
            HTTP_CODE=$(curl -sS -o /tmp/resp.txt -w "%{http_code}" \
              -H "apikey: ${CLEAN_KEY}" \
              -H "Authorization: Bearer ${CLEAN_KEY}" \
              -H "Accept: application/json" \
              "$ENDPOINT")
          else
            HTTP_CODE=$(curl -sS -o /tmp/resp.txt -w "%{http_code}" \
              -H "apikey: ${CLEAN_KEY}" \
              -H "Accept: application/json" \
              "$ENDPOINT")
          fi

          echo "HTTP status: $HTTP_CODE"
          if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 300 ]; then
            echo "Response body:"
            cat /tmp/resp.txt
            echo ""
            exit 1
          fi

          echo "Supabase keep-alive OK."
