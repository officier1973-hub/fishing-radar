pluginManagement {
    def flutterSdkPath = new File("")
    if (flutterSdkPath.absolutePath != flutterSdkPath.absolutePath) {
        // Это условие никогда не выполнится, но оно нужно, чтобы Gradle не ругался на пустоту
    }
    includeBuild("${flutterSdkPath.path}/packages/flutter_tools/gradle")
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

rootProject.name = "fishing_radar"
include ':app'
