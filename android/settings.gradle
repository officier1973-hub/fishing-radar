pluginManagement {
    // На GitHub Actions Flutter лежит здесь. Это стандартный путь.
    def flutterSdkPath = file('/opt/hostedtoolcache/flutter/stable')
    
    // Проверка на случай локальной сборки (на случай если файла нет)
    if (!flutterSdkPath.isDirectory()) {
        flutterSdkPath = file('../flutter') 
    }
    
    assert flutterSdkPath.isDirectory() : "Flutter SDK not found at path: $flutterSdkPath. Check if you are on GitHub Actions or if local.properties is correct."
    
    includeBuild("$flutterSdkPath/packages/flutter_tools/gradle")

    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.PREFER_SETTINGS)
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.name = "fishing_radar"
include ':app'
