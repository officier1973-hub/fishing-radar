pluginManagement {
    // На GitHub Actions Flutter Action сам настраивает пути.
    // Нам не нужно искать SDK вручную, просто подключаем плагин.
    includeBuild('../../../flutter/packages/flutter_tools/gradle') 

    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

// ОЧЕНЬ ВАЖНО: Убираем dependencyResolutionManagement.repositories,
// чтобы не было конфликта "repository 'Google' was added by build file".
// Пусть Gradle берет настройки только из pluginManagement.

rootProject.name = "fishing_radar"
include ':app'
