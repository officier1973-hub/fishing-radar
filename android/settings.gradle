pluginManagement {
    def flutterSdkPath = {
        def properties = new Properties()
        file("../local.properties").withInputStream { properties.load(it) }
        def flutterSdkPath = new File(properties.getProperty("flutter.sdk"))
        assert flutterSdkPath.isDirectory() : "Flutter SDK not found at path: $flutterSdkPath"
        return flutterSdkPath
    }.call()

    includeBuild("${flutterSdkPath}/packages/flutter_tools/gradle")

    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.PREFER_SETTINGS)
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.name = "fishing_radar"
include ':app'
