pluginManagement {
    def flutterSdkPath = {
        // Ищем Flutter SDK в корне (где его ставит GitHub Action)
        def flutterRoot = file('../..')
        if (flutterRoot.exists()) {
            return flutterRoot
        }
        // Если не нашли (на случай локальной сборки), ищем в родительской папке
        flutterRoot = file('../../flutter')
        if (flutterRoot.exists()) {
            return flutterRoot
        }
        throw new GradleException("Flutter SDK not found. Checked ../.. and ../../flutter")
    }.call()

    includeBuild("$flutterSdkPath/packages/flutter_tools/gradle")

    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.PREFER_SETTINGS)
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.name = "fishing_radar"
include ':app'
