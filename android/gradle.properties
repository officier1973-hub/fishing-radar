org.gradle.jvmargs=-Xmx1536M
android.useAndroidX=true
android.enableJetifier=true

# ЭТО КРИТИЧЕСКИ ВАЖНО:
# Включает использование нового декларативного подхода (plugins {})
# и заставляет Flutter не лезть в настройки репозиториев вручную.
flutter.buildForceOldPluginSystem=false
android.nonTransitiveRClass=true
