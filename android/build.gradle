buildscript {
    ext.kotlin_version = '1.7.20' // Понижаем версию
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:7.4.2'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
        classpath "dev.flutter:flutter-gradle-plugin:1.0.0"
    }
}

// ВНИМАНИЕ: Этот блок удален, чтобы не было дублей репозиториев
// dependencyResolutionManagement { ... } 

rootProject.name = "fishing_radar"
include ':app'
