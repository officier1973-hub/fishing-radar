buildscript {
    ext.kotlin_version = '1.7.20' 
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:7.4.2'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
        // СТРОКУ flutter-gradle-plugin ЗДЕСЬ УДАЛЯЕМ!
        // Она будет подключена через includeBuild в settings.gradle
    }
}

rootProject.name = "fishing_radar"
include ':app'
