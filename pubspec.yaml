name: fishing_radar
description: Гиперлокальное рыболовное приложение с картой глубин и точек клева.
publish_to: 'none'
version: 0.3.0+3

environment:
  sdk: ">=3.10.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_map: ^8.3.2
  flutter_map_mbtiles: ^1.1.0
  mbtiles: ^0.5.1
  latlong2: ^0.10.1
  geolocator: ^14.1.1
  supabase_flutter: ^2.18.3
  shared_preferences: ^2.3.5
  intl: ^0.20.2
  image_picker: ^1.1.2
  path_provider: ^2.1.5
  file_picker: ^13.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
